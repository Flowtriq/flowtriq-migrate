# FastNetMon Community Edition — basic configuration
# /etc/fastnetmon.conf

interfaces = eth0

# Thresholds
ban_for_pps = 20000
ban_for_bandwidth = 1024
ban_for_flows = 3500

# Ban settings
enable_ban = on
ban_time = 1900

# Notification
notify_script_path = /usr/local/bin/notify_about_attack.sh

# Networks
networks_list = /etc/networks_list
