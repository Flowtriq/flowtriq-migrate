# FastNetMon Community Edition — full configuration
# /etc/fastnetmon.conf

# Interfaces
interfaces = eth0

# Thresholds
ban_for_pps = 50000
ban_for_bandwidth = 2048
ban_for_flows = 5000
threshold_pps = 50000
threshold_mbps = 2048
threshold_flows = 5000

# Ban / mitigation
enable_ban = on
ban_time = 3600
unban_only_if_attack_finished = on

# Collection methods
mirror = on
mirror_netmap = off
mirror_afpacket = on
netflow = off
sflow = off
netflow_port = 2055
sflow_port = 6343

# Notification
notify_script_path = /usr/local/bin/notify_about_attack.sh
notify_script_pass_details = on

# Networks
networks_list = /etc/networks_list
networks_list_path = /etc/networks_list

# Graphite metrics
graphite = on
graphite_host = 10.0.0.50
graphite_port = 2003
graphite_prefix = fastnetmon

# ExaBGP integration
exabgp = on
exabgp_community = 65001:666
exabgp_next_hop = 192.0.2.1
exabgp_announce_host = 127.0.0.1
exabgp_announce_port = 5555

# Redis (not mapped, but present in some configs)
redis_enabled = off
