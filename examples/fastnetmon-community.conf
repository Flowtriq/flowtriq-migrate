# FastNetMon Community Edition configuration
# Typical setup for a hosting provider with mirror/SPAN monitoring

# Network interface connected to SPAN port
interfaces = eth0

# Detection thresholds
ban_for_pps = 20000
ban_for_bandwidth = 1024
ban_for_flows = 3500

# Mitigation
enable_ban = on
ban_time = 1900
unban_only_if_attack_finished = on

# Mirror mode (AF_PACKET)
mirror = on
mirror_netmap = off
mirror_afpacket = on

# Flow collectors (disabled — using mirror mode)
netflow = off
sflow = off

# Notification
notify_script_path = /usr/local/bin/notify_about_attack.sh
notify_script_pass_details = on

# Monitored networks (one CIDR per line in this file)
networks_list = /etc/networks_list

# ExaBGP blackhole
exabgp = on
exabgp_community = 65001:666
exabgp_next_hop = 192.0.2.1
exabgp_announce_host = 127.0.0.1
exabgp_announce_port = 5555
